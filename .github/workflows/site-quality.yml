name: SEO and Responsive Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/seo-prerender-responsive-20261119]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint source (exclude existing CartContext refresh warning)
        run: npm run lint -- --ignore-pattern src/context/CartContext.jsx
      - name: Build and validate prerendered SEO pages
        run: npm run build
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check 13 screen widths and three routes
        run: node scripts/check-responsive.mjs
